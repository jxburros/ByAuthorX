name: Native build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libasound2t64
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src/byax/engine.py src/byax/storage.py src/byax/cli.py
      - name: Tests with coverage floor
        run: uv run python -m pytest -q --cov=byax --cov-report=term --cov-fail-under=70 --junitxml=artifacts/tests.xml
      - name: Require executed desktop workflow tests
        if: always()
        run: uv run python scripts/check_test_report.py artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}
          path: artifacts/tests.xml
      - run: uv run python scripts/build.py --bundle-only
      - name: Frozen CLI smoke test (Linux)
        if: runner.os == 'Linux'
        run: dist/ByAuthorX/byax capabilities --json
      - name: Frozen CLI smoke test (Windows)
        if: runner.os == 'Windows'
        run: dist/ByAuthorX/byax.exe capabilities --json
      - name: Build Ubuntu package
        if: runner.os == 'Linux'
        run: uv run python scripts/build_deb.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ByAuthorX-${{ matrix.os }}-x64
          path: |
            dist/ByAuthorX/
            dist/*.deb
            dist/*setup.exe
