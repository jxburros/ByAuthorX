name: Native build and tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'design/**', 'assets/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'design/**', 'assets/**', '**.md']
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Select native packaging checks
        env:
          FULL_BUILD: ${{ github.event_name != 'pull_request' && github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          base = os.environ['BASE']
          full = os.environ['FULL_BUILD'] == 'true' or not base or set(base) == {'0'}
          if not full:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              full = any(p.startswith(('packaging/', '.github/workflows/')) or p in
                         ('scripts/build.py', 'scripts/build_deb.py', 'scripts/build_macos.py', 'scripts/smoke_distribution.py', 'src/byax/resources/models.json', 'pyproject.toml', 'uv.lock') for p in paths)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'packages={str(full).lower()}\n')
          PY
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libasound2t64
      - run: uv sync --frozen --extra dev --extra local-models --extra sqlite-vec
      - name: Static checks (once per run)
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check src tests
          uv run --no-sync mypy
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --extra local-models --extra sqlite-vec --no-emit-project -o /tmp/byax-requirements.txt > /dev/null
          uvx pip-audit==2.10.1 -r /tmp/byax-requirements.txt --no-deps --disable-pip
      - name: Full app tests with branch coverage
        run: uv run --no-sync pytest -q --cov=byax --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=70 --durations=15
      - name: Build wheel and sdist
        run: uv build
      - name: Installed wheel smoke (outside source tree)
        run: |
          uv venv /tmp/byax-wheel
          uv pip install --python /tmp/byax-wheel/bin/python dist/*.whl
          uv run --no-sync python scripts/smoke_distribution.py /tmp/byax-wheel/bin/byax /tmp/byax-wheel/bin/byax-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-2022
            python: '3.12'
          # Apple silicon runner. Same focused subset as Windows; the full suite runs on Linux.
          - os: macos-14
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libasound2t64
      - run: uv sync --frozen --extra dev
      - name: Platform and minimum-Python regression tests
        run: >-
          uv run --no-sync pytest -q tests/test_storage.py tests/test_history_save.py
          tests/test_cli.py tests/test_mcp.py tests/test_service_boundary.py
          tests/test_jobs.py tests/test_jobs_recovery.py tests/test_libraries.py
          tests/test_security_acceptance.py tests/test_release_metadata.py
          tests/test_gui_workspace.py tests/test_gui_review.py tests/test_formatting_dependencies.py
          tests/test_macos_support.py tests/test_updates.py tests/test_onboarding.py
  packages:
    needs: [plan, quality, compatibility]
    if: needs.plan.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libasound2t64
      # The on-device runtime (onnxruntime, tokenizers) is frozen into both variants; only the standard
      # variant also carries model files.
      - run: uv sync --frozen --extra dev --extra local-models
      - run: uv run --no-sync python scripts/build.py --bundle-only
      - name: Frozen CLI smoke test (Linux)
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/smoke_distribution.py dist/ByAuthorX/byax dist/ByAuthorX/byax-mcp
      - name: Frozen CLI smoke test (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/smoke_distribution.py dist/ByAuthorX/byax.exe dist/ByAuthorX/byax-mcp.exe
      - name: Frozen CLI smoke test (macOS app bundle)
        if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/smoke_distribution.py dist/ByAuthorX.app/Contents/MacOS/byax dist/ByAuthorX.app/Contents/MacOS/byax-mcp
      - name: Build Ubuntu package (lean)
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/build_deb.py --variant lean
      - name: Build Windows installer (lean)
        if: runner.os == 'Windows'
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler /DLean packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The standard variant bundles models downloaded from the models-v1 mirror release. Until a
      # maintainer publishes that release (docs/packaging.md), only the lean variant is built.
      - name: Is the models mirror populated?
        id: models
        run: uv run --no-sync python scripts/build.py --models-status
      - name: Standard variant with bundled models
        if: steps.models.outputs.models_populated == 'true' && runner.os != 'macOS'
        run: uv run --no-sync python scripts/build.py --variant standard
      - name: Frozen smoke test with bundled models (Linux)
        if: steps.models.outputs.models_populated == 'true' && runner.os == 'Linux'
        run: uv run --no-sync python scripts/smoke_distribution.py dist/ByAuthorX-standard/byax dist/ByAuthorX-standard/byax-mcp --expect-bundled
      - name: Frozen smoke test with bundled models (Windows)
        if: steps.models.outputs.models_populated == 'true' && runner.os == 'Windows'
        run: uv run --no-sync python scripts/smoke_distribution.py dist/ByAuthorX-standard/byax.exe dist/ByAuthorX-standard/byax-mcp.exe --expect-bundled
      - name: Build Ubuntu package (standard)
        if: steps.models.outputs.models_populated == 'true' && runner.os == 'Linux'
        run: uv run --no-sync python scripts/build_deb.py --variant standard
      - name: Build Windows installer (standard)
        if: steps.models.outputs.models_populated == 'true' && runner.os == 'Windows'
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record installer sizes
        shell: bash
        run: ls -l dist/*.deb dist/*setup.exe 2>/dev/null || true
      # The macOS disk image is built, signed and notarized by release.yml; here the bundle only has to freeze and run.
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: ByAuthorX-${{ matrix.os }}-x64
          path: |
            dist/*.deb
            dist/*setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  # Manual only: the full evaluation fixtures (30 PLOS papers fetched and hash-verified), the keyword and
  # fake-embedder configurations on everything, and any model-backed tests whose provider is configured.
  # The fast keyword/fake-embedder gate already runs in the normal pytest job above.
  eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      BYAX_EVAL_CACHE: ${{ github.workspace }}/.eval-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libasound2t64
      - run: uv sync --frozen --extra dev
      - uses: actions/cache@v4
        with:
          path: .eval-cache
          key: eval-papers-${{ hashFiles('tests/fixtures/eval/MANIFEST.json') }}
      - name: Fetch and verify the evaluation papers
        run: uv run --no-sync python scripts/fetch_eval_fixtures.py
      - name: Retrieval harness on the full fixtures
        run: uv run --no-sync python scripts/eval_retrieval.py --configs keyword hybrid-fake --out-dir artifacts/bench
      - name: Model-backed evaluation (skips unless BYAX_EVAL_PROVIDER is set)
        run: uv run --no-sync pytest -m eval_models -q
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: artifacts/bench
          retention-days: 30
  # Optional by trigger: EPUBCheck needs Java, so it runs on manual and weekly runs only. The
  # built-in structural check (byax.epub.validate) runs in the normal test suite on every change.
  epubcheck:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      EPUBCHECK_VERSION: '5.3.0'
      EPUBCHECK_SHA256: 6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libasound2t64
      - run: uv sync --frozen --extra dev
      - name: Download EPUBCheck (pinned release, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
      - name: Export every fixture as EPUB and validate it
        run: >-
          uv run --no-sync python scripts/epubcheck_fixtures.py --out artifacts/epub
          --epubcheck "$RUNNER_TEMP/epubcheck/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" --warnings-fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epubcheck-report
          path: artifacts/epub/epubcheck-report.json
          retention-days: 14
