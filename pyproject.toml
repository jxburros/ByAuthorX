[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byauthorx"
version = "0.3.0"
description = "Native, programmable desktop word processor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # PySide 6.12 corrupts None references in nested save/close callbacks on CPython 3.11.
    "PySide6-Essentials>=6.8,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.8,<7; python_version >= '3.12'",
    "PySide6-Addons>=6.8,<6.12; python_version < '3.12'",
    "PySide6-Addons>=6.8,<7; python_version >= '3.12'",
    "regex>=2024.11",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "markdown-it-py>=3,<5",
    "python-docx>=1.1,<2",
    "odfpy>=1.4,<2",
    "Pillow>=11,<13",
    "platformdirs>=4,<5",
    "striprtf>=0.0.28",
    "defusedxml>=0.7",
    "pyspellchecker>=0.8",
    "citeproc-py>=0.9,<1",
    "citeproc-py-styles>=0.1,<1",
    "bibtexparser>=1.4,<2",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.11", "pyinstaller>=6"]

[project.scripts]
byax = "byax.cli:main"
byauthorx = "byax.gui:main"
byax-mcp = "byax.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/byax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
files = ["src/byax/engine.py", "src/byax/storage.py", "src/byax/cli.py", "src/byax/service.py", "src/byax/mcp.py", "src/byax/transport_policy.py", "src/byax/citations.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_incomplete_defs = true
no_implicit_optional = true
